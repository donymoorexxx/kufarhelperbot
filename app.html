<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kufar Helper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета приложения: поменяй три переменные --accent, --accent-2, --price, чтобы сменить палитру */
  :root {
    --accent: #1565ff; --accent-2: #e8f0ff; --price: #12a150;
    --bg: #f1f3f6; --card: #ffffff; --text: #14181f; --muted: #7a8494; --line: #e4e8ee;
    --danger: #e5393b; --shadow: 0 1px 2px rgba(20,24,31,.06), 0 4px 14px rgba(20,24,31,.05);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    --accent: #4d8dff; --accent-2: #1a2740; --price: #3ccf7d;
    --bg: #0f1218; --card: #1a1f29; --text: #eef1f6; --muted: #8b95a7; --line: #2a303c;
    --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif; }
  body { padding-bottom: calc(76px + var(--safe-b)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, select { font: inherit; color: var(--text); }

  .top { position: sticky; top: 0; z-index: 5; background: var(--card); padding: 12px 16px 10px;
    display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 0 var(--line); }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: -.3px; color: var(--accent); }
  .logo span { color: var(--text); font-weight: 600; }
  .pill { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--accent-2); color: var(--accent); }
  .pill.off { background: var(--line); color: var(--muted); }

  .wrap { padding: 14px 14px 0; max-width: 640px; margin: 0 auto; }
  h2 { margin: 6px 2px 10px; font-size: 18px; letter-spacing: -.2px; }
  .group { margin: 18px 2px 8px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--card); outline: none; }
  .search:focus { border-color: var(--accent); }

  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { background: var(--card); border-radius: 14px; padding: 14px 12px; text-align: left; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 8px; min-height: 86px; transition: transform .12s; }
  .tile:active { transform: scale(.97); }
  .tile .ic { font-size: 26px; }
  .tile .nm { font-weight: 600; line-height: 1.2; }

  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .cat-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-2); display: grid; place-items: center; font-size: 22px; flex: none; }
  .title { font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { padding: 5px 10px; border-radius: 999px; background: var(--bg); font-size: 12.5px; color: var(--muted); }
  .chip.sel { background: var(--accent); color: #fff; }
  .chips.big .chip { font-size: 14px; padding: 8px 14px; margin: 0; border: 1.5px solid var(--line); background: var(--card); color: var(--text); }
  .chips.big .chip.sel { background: var(--accent); border-color: var(--accent); color: #fff; }

  .switch { position: relative; width: 50px; height: 30px; border-radius: 999px; background: var(--line); flex: none; transition: .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .switch.on { background: var(--price); }
  .switch.on::after { left: 23px; }

  .ad { display: block; text-decoration: none; color: inherit; }
  .ad .price { color: var(--price); font-weight: 800; font-size: 16px; }

  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty .big { font-size: 54px; margin-bottom: 6px; }

  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; text-align: center; }
  .btn:active { opacity: .85; }
  .btn.ghost { background: var(--accent-2); color: var(--accent); }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn[disabled] { opacity: .5; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); display: flex;
    padding: 6px 6px calc(6px + var(--safe-b)); box-shadow: 0 -1px 0 var(--line); z-index: 6; }
  .tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .tabs button .ti { font-size: 21px; filter: grayscale(1); opacity: .7; }
  .tabs button.on { color: var(--accent); }
  .tabs button.on .ti { filter: none; opacity: 1; }

  .overlay { position: fixed; inset: 0; background: rgba(8,10,14,.5); z-index: 20; animation: fade .18s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 22px 22px 0 0;
    max-height: 92vh; overflow-y: auto; padding: 8px 18px calc(18px + var(--safe-b)); animation: up .24s ease-out; max-width: 640px; margin: 0 auto; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 14px; }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  .lbl { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; }
  .inp { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); outline: none; }
  .inp:focus { border-color: var(--accent); background: var(--card); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translateX(-50%); z-index: 40; background: #1c212b; color: #fff;
    padding: 11px 16px; border-radius: 12px; font-size: 14px; max-width: 90%; text-align: center; animation: fade .2s; }
  .center { min-height: 60vh; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
document.documentElement.dataset.theme = tg && tg.colorScheme === "dark" ? "dark" : "light";
if (tg) { try { tg.setHeaderColor(tg.colorScheme === "dark" ? "#1a1f29" : "#ffffff"); } catch (e) {} }

const S = { tab: "mine", ready: false, error: null, cats: [], regions: [], mine: [], history: [], user: { paused: false, interval: 5 }, q: "", sheet: null, saving: false };
const INTERVALS = [1, 5, 10, 30, 60];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, body) {
  const r = await fetch("/api/" + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "X-Init-Data": (tg && tg.initData) || "" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Ошибка " + r.status);
  return j;
}

function toast(msg) {
  const old = $(".toast"); if (old) old.remove();
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
const haptic = (t) => { try { tg.HapticFeedback.notificationOccurred(t || "success"); } catch (e) {} };

async function load() {
  try {
    const [cat, st] = await Promise.all([api("catalog"), api("state")]);
    S.cats = cat.categories; S.regions = cat.regions;
    S.mine = st.categories; S.history = st.history; S.user = st.user;
    S.ready = true; S.error = null;
  } catch (e) { S.error = e.message; S.ready = true; }
  render();
}

const iconOf = (key) => (S.cats.find((c) => c.id === key) || {}).icon || "🛍️";
const money = (v) => (v == null ? null : Math.round(v) + " BYN");

function filterChips(c) {
  const out = [];
  if (c.min_price != null || c.max_price != null) out.push("💰 " + (c.min_price != null ? "от " + money(c.min_price) : "") + (c.max_price != null ? " до " + money(c.max_price) : ""));
  if (c.city) out.push("📍 " + esc(c.city));
  if (c.keywords) out.push("🔎 " + esc(c.keywords));
  if (c.exclude) out.push("🚫 " + esc(c.exclude));
  out.push("⏱ " + c.interval + " мин");
  return out.map((t) => '<span class="chip">' + t + "</span>").join("");
}

/* ───────── Экраны ───────── */

function viewMine() {
  if (!S.mine.length) {
    return '<div class="empty"><div class="big">🔔</div><div class="title">Пока нет категорий</div>' +
      '<div class="sub" style="margin:6px 0 18px">Выбери категорию из каталога, и новые объявления будут приходить в чат</div>' +
      '<button class="btn" data-act="tab" data-v="add">Выбрать категорию</button></div>';
  }
  return "<h2>Мои категории</h2>" + S.mine.map((c) =>
    '<div class="card"><div class="row" data-act="edit" data-id="' + c.id + '">' +
    '<div class="cat-ic">' + iconOf(c.cat_key) + "</div>" +
    '<div class="grow"><div class="title">' + esc(c.title) + '</div><div class="sub">' + (c.active ? "Слежу за новыми" : "Выключено") + "</div></div>" +
    '<div class="switch ' + (c.active ? "on" : "") + '" data-act="toggle" data-id="' + c.id + '"></div></div>' +
    '<div class="chips">' + filterChips(c) + "</div></div>").join("");
}

function tilesHtml() {
  const q = S.q.trim().toLowerCase();
  const list = S.cats.filter((c) => !q || c.name.toLowerCase().includes(q));
  if (!list.length) return '<div class="empty">Ничего не найдено</div>';
  let html = "", g = null;
  for (const c of list) {
    if (c.group !== g) { if (g !== null) html += "</div>"; g = c.group; html += '<div class="group">' + esc(g) + '</div><div class="tiles">'; }
    html += '<button class="tile" data-act="pick" data-id="' + c.id + '"><span class="ic">' + c.icon + '</span><span class="nm">' + esc(c.name) + "</span></button>";
  }
  return html + "</div>";
}

function viewAdd() {
  return '<h2>Выбери категорию</h2><input class="search" id="q" placeholder="Поиск по категориям" value="' + esc(S.q) + '">' +
    '<div id="tiles">' + tilesHtml() + "</div>";
}

function viewHistory() {
  if (!S.history.length) return '<div class="empty"><div class="big">📋</div><div class="title">История пуста</div><div class="sub">Здесь появятся объявления, которые прислал бот</div></div>';
  return "<h2>История объявлений</h2>" + S.history.map((h, i) =>
    '<a class="card ad" data-act="open" data-i="' + i + '"><div class="price">' + esc(h.price) + '</div><div class="title" style="margin-top:2px">' + esc(h.title) +
    '</div><div class="sub">' + new Date(h.ts * 1000).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + "</div></a>").join("");
}

function viewSettings() {
  return "<h2>Настройки</h2>" +
    '<div class="card"><div class="row"><div class="grow"><div class="title">Мониторинг</div><div class="sub">' + (S.user.paused ? "Приостановлен, уведомления не приходят" : "Работает, уведомления приходят в чат") +
    '</div></div><div class="switch ' + (S.user.paused ? "" : "on") + '" data-act="pause"></div></div></div>' +
    '<div class="card"><div class="title">Интервал по умолчанию</div><div class="sub">Для новых категорий. Как часто проверять Kufar</div>' +
    '<div class="chips big">' + INTERVALS.map((n) => '<button class="chip ' + (S.user.interval === n ? "sel" : "") + '" data-act="definterval" data-v="' + n + '">' + n + " мин</button>").join("") + "</div></div>" +
    '<div class="hint" style="padding:0 6px">Уведомления приходят в личный чат с ботом, даже если приложение закрыто.</div>';
}

function sheetHtml() {
  const sh = S.sheet; if (!sh) return "";
  const f = sh.f, adding = sh.mode === "add";
  const cat = adding ? sh.cat : null;
  const title = adding ? cat.icon + " " + esc(cat.name) : esc(sh.title);
  return '<div class="overlay" data-act="close"></div><div class="sheet"><div class="grab"></div>' +
    '<div class="title" style="font-size:19px">' + title + "</div>" +
    (adding ? '<div class="lbl">Регион</div><div class="chips big">' + S.regions.map((r) => '<button class="chip ' + (sh.region === r.id ? "sel" : "") + '" data-act="region" data-id="' + r.id + '">' + esc(r.name) + "</button>").join("") + "</div>" : "") +
    '<div class="lbl">Цена, BYN</div><div class="two"><input class="inp" inputmode="decimal" data-f="min_price" placeholder="от" value="' + esc(f.min_price) + '"><input class="inp" inputmode="decimal" data-f="max_price" placeholder="до" value="' + esc(f.max_price) + '"></div>' +
    '<div class="lbl">Город содержит</div><input class="inp" data-f="city" placeholder="например, Минск" value="' + esc(f.city) + '">' +
    '<div class="lbl">Ключевые слова</div><input class="inp" data-f="keywords" placeholder="iphone, 128gb" value="' + esc(f.keywords) + '"><div class="hint">Через запятую. Достаточно любого из слов</div>' +
    '<div class="lbl">Исключить слова</div><input class="inp" data-f="exclude" placeholder="разбит, на запчасти" value="' + esc(f.exclude) + '">' +
    '<div class="lbl">Проверять каждые</div><div class="chips big">' + INTERVALS.map((n) => '<button class="chip ' + (Number(f.interval) === n ? "sel" : "") + '" data-act="fint" data-v="' + n + '">' + n + " мин</button>").join("") + "</div>" +
    '<div style="margin-top:22px"><button class="btn" data-act="save"' + (S.saving ? " disabled" : "") + ">" + (S.saving ? "Сохраняю…" : adding ? "Следить за категорией" : "Сохранить") + "</button>" +
    (adding ? "" : '<button class="btn danger" style="margin-top:6px" data-act="delete">Удалить категорию</button>') + "</div></div>";
}

function render() {
  const root = $("#root");
  if (!S.ready) { root.innerHTML = '<div class="center">Загружаю…</div>'; return; }
  if (S.error) {
    root.innerHTML = '<div class="center"><div><div style="font-size:46px">😕</div><div class="title" style="color:var(--text);margin:8px 0">Не получилось загрузить</div>' +
      "<div>" + esc(S.error) + '</div><br><button class="btn ghost" data-act="reload">Повторить</button></div></div>';
    return;
  }
  const views = { mine: viewMine, add: viewAdd, history: viewHistory, settings: viewSettings };
  const tabs = [["mine", "🔔", "Мои"], ["add", "➕", "Каталог"], ["history", "📋", "История"], ["settings", "⚙️", "Настройки"]];
  const keepQ = document.activeElement && document.activeElement.id === "q";
  root.innerHTML =
    '<div class="top"><div class="logo">kufar<span> helper</span></div><div class="pill ' + (S.user.paused ? "off" : "") + '">' + (S.user.paused ? "⏸ Пауза" : "● Мониторинг") + "</div></div>" +
    '<div class="wrap">' + views[S.tab]() + "</div>" +
    '<div class="tabs">' + tabs.map((t) => '<button class="' + (S.tab === t[0] ? "on" : "") + '" data-act="tab" data-v="' + t[0] + '"><span class="ti">' + t[1] + "</span>" + t[2] + "</button>").join("") + "</div>" +
    sheetHtml();
  if (keepQ) { const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}

/* ───────── Действия ───────── */

function openAdd(id) {
  const cat = S.cats.find((c) => c.id === id);
  S.sheet = { mode: "add", cat, region: "all", f: { min_price: "", max_price: "", city: "", keywords: "", exclude: "", interval: S.user.interval } };
  render();
}
function openEdit(id) {
  const c = S.mine.find((x) => x.id === id); if (!c) return;
  S.sheet = { mode: "edit", id, title: iconOf(c.cat_key) + " " + c.title, f: {
    min_price: c.min_price == null ? "" : c.min_price, max_price: c.max_price == null ? "" : c.max_price,
    city: c.city || "", keywords: c.keywords || "", exclude: c.exclude || "", interval: c.interval } };
  render();
}

async function run(fn) {
  try { await fn(); } catch (e) { haptic("error"); toast(e.message); S.saving = false; render(); }
}

document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; $("#tiles").innerHTML = tilesHtml(); return; }
  const k = e.target.dataset && e.target.dataset.f;
  if (k && S.sheet) S.sheet.f[k] = e.target.value;
});

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (act === "toggle") {
    e.stopPropagation();
    return run(async () => { await api("toggle", { id: Number(id) }); const c = S.mine.find((x) => x.id === Number(id)); c.active = c.active ? 0 : 1; render(); });
  }
  if (act === "tab") { S.tab = v; S.sheet = null; render(); window.scrollTo(0, 0); }
  else if (act === "reload") { S.ready = false; render(); load(); }
  else if (act === "pick") openAdd(id);
  else if (act === "edit") openEdit(Number(id));
  else if (act === "close") { S.sheet = null; render(); }
  else if (act === "region") { S.sheet.region = id; render(); }
  else if (act === "fint") { S.sheet.f.interval = Number(v); render(); }
  else if (act === "open") { const h = S.history[Number(el.dataset.i)]; if (tg && tg.openLink) tg.openLink(h.url); else window.open(h.url, "_blank"); }
  else if (act === "pause") run(async () => { await api("settings", { paused: !S.user.paused }); S.user.paused = !S.user.paused; haptic(); render(); });
  else if (act === "definterval") run(async () => { await api("settings", { interval: Number(v) }); S.user.interval = Number(v); haptic(); render(); });
  else if (act === "save") run(async () => {
    S.saving = true; render();
    const sh = S.sheet;
    if (sh.mode === "add") await api("subscribe", { category: sh.cat.id, region: sh.region, filters: sh.f });
    else await api("update", { id: sh.id, fields: sh.f });
    const st = await api("state"); S.mine = st.categories; S.history = st.history;
    S.saving = false; S.sheet = null; if (sh.mode === "add") S.tab = "mine";
    haptic(); toast(sh.mode === "add" ? "Готово! Слежу за новыми объявлениями" : "Сохранено"); render();
  });
  else if (act === "delete") {
    const go = async () => run(async () => { await api("delete", { id: S.sheet.id }); S.mine = S.mine.filter((c) => c.id !== S.sheet.id); S.sheet = null; haptic(); toast("Категория удалена"); render(); });
    if (tg && tg.showConfirm) tg.showConfirm("Удалить категорию?", (ok) => ok && go()); else if (confirm("Удалить категорию?")) go();
  }
});

if (tg && !tg.initData) { S.ready = true; S.error = "Открой приложение через Telegram: бот → кнопка «Kufar» или /start"; render(); }
else { render(); load(); }
</script>
</body>
</html>
